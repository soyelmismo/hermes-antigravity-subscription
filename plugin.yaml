name: antigravity-subscription-directsdk
manifest_version: 2
version: "1.0.27"
kind: model-provider
description: "Run Hermes on an Antigravity / Gemini subscription via the official agy CLI (DirectSDK path). Streams tokens progressively, persists multi-turn trajectories via agy --conversation (up to 239k tokens), embeds image/video/audio natively as file references agy reads and uploads as pixels, discovers models dynamically per account, maps thinking effort, tracks quota in /usage, aborts reported native tool steps, reaps orphaned workers, and cleans every ephemeral session dir on close."
author: "soyelmismo"
license: MIT
homepage: https://github.com/soyelmismo/hermes-antigravity-subscription
platforms:
  - linux
  - macos
  - windows
requires_hermes: ">=0.21.4"
external_dependencies:
  - command: agy
capabilities: []
